name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The release body IS the CHANGELOG section for this version — a
      # release without a real description is incomplete (org standard).
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## (\\[)?(v)?"ver"([] ]|$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      # Idempotent: the org's pre-stable model MOVES one tag, and every
      # move re-fires this workflow — an existing release is updated, not
      # a collision.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --draft=false is load-bearing, not a restatement of the default. Deleting a
          # tag reverts its release to a DRAFT, and moving the tag goes through a
          # delete-then-push wherever `git push --force` is unavailable. `gh release edit`
          # leaves that flag exactly as it finds it, so without this the run goes GREEN
          # while republishing nothing: correct tag, invisible release. Measured in
          # laranail/validation-js on 2026-11-08, whose release had to be published by hand.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-body.md \
              --generate-notes
          fi
