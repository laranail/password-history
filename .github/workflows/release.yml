name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release body IS the CHANGELOG section for this version — a
      # release without a real description is incomplete (org standard).
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## (\\[)?(v)?"ver"([] ]|$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      # Idempotent: the org's pre-stable model MOVES one tag, and every
      # move re-fires this workflow — an existing release is updated, not
      # a collision.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-body.md \
              --generate-notes
          fi
